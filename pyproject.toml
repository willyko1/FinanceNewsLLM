[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "matt-finance"
version = "1.0.0"
description = "An evidence-first financial research agent powered by MCP"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "mcp>=1.9,<2",
  "openai>=1.75,<3",
  "python-dotenv>=1.0,<2",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
  "ruff>=0.11,<1",
]

[project.scripts]
matt = "finresearch.web:run"
matt-mcp = "finresearch.mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/finresearch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["LLM.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
